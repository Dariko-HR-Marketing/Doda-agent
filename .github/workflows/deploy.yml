name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH sozlash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Fayllarni serverga yuborish
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            --include='index.html' --include='app.css' --include='app.js' \
            --exclude='*' \
            ./ "$VPS_USER@$VPS_HOST:/var/www/doda/"

      - name: Tekshiruv
        run: |
          sleep 3
          curl -fsS -o /dev/null -w '%{http_code}\n' https://doda.tajriba24.uz/
